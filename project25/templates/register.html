<!DOCTYPE HTML>
<html>

<head>
    <title> Register HTML page </title>
</head>
<body>
    {% if error %}
    <p>{{error}}</p>
    {% endif %}
    <form action="/register/" method="get">
        <p>Register!</p>
        <p>Username : <input type="text" name="username"></input></p>
        <p>Password : <input type="password" name="password"></input></p>
        <p>Confirm password : <input type="password" name="confirmPassword"></input></p>
        <p><input type="submit" name="click"></input></p>
    </form>
</body>
</html>
